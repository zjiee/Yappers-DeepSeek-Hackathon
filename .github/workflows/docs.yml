# Documentation site.
#
# Renders README.md + docs/*.md from BOTH track branches into a single static
# site and force-publishes it to the `gh-pages` branch, which GitHub Pages
# serves. The generator lives on `main`; the prose lives on `track1` and
# `track2`, so a push to any of the three rebuilds everything.
#
# The prose stays plain Markdown that reads correctly on GitHub — the site is
# a build artefact and is never committed to a source branch.
#
# This workflow file is duplicated on all three branches because GitHub runs
# the copy that lives on the branch you pushed to. Keep the copies in step —
# and because .github/workflows is part of the protected judging environment,
# run ./scripts/verify_judging_env.sh --update on each branch after changing
# it, or every team's integrity check fails on a file they never touched.

name: Docs

on:
  push:
    branches: [main, track1, track2]
    paths:
      - "README.md"
      - "docs/**"
      - "docs-site/**"
      - ".github/workflows/docs.yml"
  workflow_dispatch:

# Only the deploy job writes, and only to the gh-pages branch.
permissions:
  contents: write

# A push to main and a push to track2 both rebuild the whole site. Let the
# later one win rather than racing for the same branch.
concurrency:
  group: docs-pages
  cancel-in-progress: true

env:
  UPSTREAM: NTUDeepSpeed/Recruitment_Hackathon_2627

jobs:
  build:
    name: Build and publish
    # Teams fork this repository to compete. Their pushes must not spend their
    # Actions minutes rebuilding our documentation, so the job is a no-op
    # anywhere but upstream. (`judge.yml` is deliberately not guarded — racing
    # your entry on every push is the point of a fork.)
    if: github.repository == 'NTUDeepSpeed/Recruitment_Hackathon_2627'
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out the generator (main)
        uses: actions/checkout@v4
        with:
          ref: main
          path: site

      # Only the prose is needed from the track branches. Sparse checkout keeps
      # the simulator payload and the submodules out of the runner entirely.
      - name: Check out Track 1 prose
        uses: actions/checkout@v4
        with:
          ref: track1
          path: track1
          sparse-checkout: docs

      - name: Check out Track 2 prose
        uses: actions/checkout@v4
        with:
          ref: track2
          path: track2
          sparse-checkout: docs

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: site/docs-site/requirements.txt

      - name: Install build dependencies
        run: python -m pip install --disable-pip-version-check -r site/docs-site/requirements.txt

      - name: Build the site
        run: |
          python site/docs-site/build.py \
            --out _site \
            --src track1=track1 \
            --src track2=track2

      - name: Check internal links
        run: python site/docs-site/check_links.py _site

      - name: Upload the build
        uses: actions/upload-artifact@v4
        with:
          name: docs-site
          path: _site
          retention-days: 7

      - name: Publish to gh-pages
        if: github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          remote="https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"

          rm -rf .deploy && mkdir .deploy && cd .deploy
          git init -q
          git remote add origin "$remote"
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          # Keep the branch's history if it exists, so `git log gh-pages` shows
          # when the docs actually changed.
          if git fetch -q --depth 1 origin gh-pages; then
            git checkout -q -b gh-pages FETCH_HEAD
            git rm -rq --ignore-unmatch .
          else
            git checkout -q -b gh-pages
          fi

          cp -a ../_site/. .
          git add -A

          if git diff --quiet --cached; then
            echo "Site is unchanged — nothing to publish."
            exit 0
          fi

          git commit -q -m "Docs: build from ${GITHUB_REF_NAME}@${GITHUB_SHA:0:7}"
          git push -q origin gh-pages
          echo "Published ${GITHUB_SHA:0:7} to gh-pages."

      - name: Summary
        if: always()
        run: |
          {
            echo "### Documentation site"
            echo
            echo "| | |"
            echo "| --- | --- |"
            echo "| Triggered by | \`${GITHUB_REF_NAME}\` |"
            echo "| Pages built | $(find _site -name '*.html' 2>/dev/null | wc -l) |"
            echo "| Published at | https://ntudeepspeed.github.io/Recruitment_Hackathon_2627/ |"
          } >> "$GITHUB_STEP_SUMMARY"
