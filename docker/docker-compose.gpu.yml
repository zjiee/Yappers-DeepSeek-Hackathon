# GPU overlay, merged on top of docker-compose.yml when a usable NVIDIA GPU is
# detected (or when you pass --gpu). It is a separate file because a `deploy`
# block asking for an nvidia device makes `up` fail outright on a machine
# without one, which is most laptops and every Mac.
#
# install/<os>/run.sh adds this automatically; if attaching the GPU fails it
# retries without it rather than leaving you with a dead container.
#
# What the GPU is for here: your own code, and rendering the simulator when you
# want to watch it. A scored run is headless (-batchmode -nographics), which
# creates no graphics device at all, so judging does not depend on this.

services:
  sim:
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu, compute, utility, graphics]
    environment:
      - NVIDIA_VISIBLE_DEVICES=all
      - NVIDIA_DRIVER_CAPABILITIES=all
